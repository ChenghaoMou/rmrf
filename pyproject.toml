[project]
name = "rmrf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rich>=13.9.3",
  "pymupdf>=1.24.12",
  "python-dotenv>=1.0.1",
  "pyzotero>=1.5.25",
  "pillow>=11.0.0",
  "shapely>=2.0.6",
  "diskcache>=5.6.3",
  "rmscene",
  "jinja2>=3.1.4",
  "typer>=0.13.1",
  "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv.sources]
rmscene = { path = "../rmscene", editable = true }

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff]
line-length = 120

[tool.mypy]
ignore_missing_imports = true
strict = true
local_partial_types = true
warn_unreachable = true
follow_imports = "silent"
warn_unused_ignores = false
exclude = ['^tests/']

[dependency-groups]
dev = [
  "ruff>=0.14.10",
  "streamlit>=1.22.0",
  "matplotlib>=3.9.2",
  "pillow>=11.0.0",
  "gradio>=3.36.1",
  "setuptools>=75.6.0",
  "pytest>=9.1.1",
]
